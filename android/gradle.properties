org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# JDK берётся от Android Studio: системная Java на машине разработчика новее, чем
# переваривает AGP. Путь машинно-зависимый, поэтому CI перекрывает его флагом
# -Dorg.gradle.java.home=$JAVA_HOME (см. .github/workflows/publish-content.yml).
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 36 (Android 16) with AGP 8.7.3 — suppress the "untested compileSdk" warning.
android.suppressUnsupportedCompileSdk=36
