<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>History Teller</title>
<!-- MRAID подставляет рекламный SDK; внешних запросов (даже mraid.js) AppLovin не допускает. -->
<style>
  :root {
    --backdrop:#34222E; --paper:#F1E4C7; --panel:#F7EFDC; --edge:#DECBA3; --ink:#2B2419;
    --ink-soft:rgba(43,36,25,.6); --gold:#C9A24B; --maroon:#8A3B4A; --success:#4C8B51;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  /* Встроенное перетаскивание картинок браузера перехватывает жест и съедает «отпустил». */
  img { -webkit-user-drag:none; user-drag:none; }
  html, body { margin:0; height:100%; background:var(--backdrop); overflow:hidden; touch-action:none;
    font-family:Georgia, "Times New Roman", serif; color:var(--ink); }
  #stage { position:absolute; left:50%; top:50%; width:360px; height:640px; transform-origin:0 0; }
  /* Ландшафт (AppLovin требует обе ориентации): кадры в ряд, как в самой игре. */
  body.land #stage { width:640px; height:360px; }
  body.land #head { top:6px; height:52px; }
  body.land #tray { top:236px; }
  body.land #scenes { left:6px; right:326px; top:22px; }
  body.land #chars { left:322px; right:6px; top:18px; height:84px; }
  body.land .scene .pic { width:94px; height:50px; }
  body.land .char .pic { width:58px; height:58px; }
  .page { position:absolute; inset:0; background:var(--paper); border-radius:18px; overflow:hidden;
    box-shadow:inset 0 0 0 3px var(--edge), inset 0 0 40px rgba(120,90,40,.18); }

  /* Шапка: цель уровня */
  #head { position:absolute; left:12px; right:12px; top:10px; height:66px; display:flex; align-items:center; gap:10px; }
  #head .icon { width:44px; height:44px; border-radius:11px; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  #head .txt { flex:1; min-width:0; }
  #title { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--maroon); font-weight:bold; }
  #goal { font-size:16px; font-weight:bold; line-height:1.15; margin-top:2px; }
  #goal .crown { color:var(--gold); }
  #cta-top { flex:none; background:var(--maroon); color:var(--paper); font:bold 13px Georgia,serif;
    padding:9px 12px; border-radius:20px; border:2px solid var(--ink); cursor:pointer; }

  /* Кадры */
  .frame { position:absolute; border-radius:12px; overflow:hidden;
    background:var(--panel); border:2.5px solid var(--ink); transition:transform .15s, box-shadow .15s; }
  .frame.hover { box-shadow:0 0 0 4px var(--gold); transform:scale(1.015); }
  .frame.shake { animation:shake .45s; }
  .frame.win { box-shadow:0 0 0 4px var(--gold), 0 0 26px rgba(201,162,75,.9); }
  .frame .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .frame .shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 38%); }
  .frame .num { position:absolute; left:8px; top:8px; width:22px; height:22px; border-radius:50%;
    background:var(--maroon); color:var(--paper); font:bold 13px Georgia; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--gold); z-index:3; }
  .frame .label { position:absolute; left:36px; top:7px; right:40px; color:#fff; font-size:14px; font-weight:bold;
    text-shadow:0 1px 3px rgba(0,0,0,.8); z-index:3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .frame .label i { font-style:normal; font-weight:normal; font-size:11px; opacity:.9; margin-left:5px;
    background:rgba(0,0,0,.35); padding:1px 6px; border-radius:8px; }
  .frame .clear { position:absolute; right:7px; top:6px; width:24px; height:24px; border-radius:50%; z-index:3;
    background:rgba(255,255,255,.85); color:var(--ink); font:bold 14px sans-serif; display:flex; align-items:center; justify-content:center; }
  .frame .empty { position:absolute; inset:10px 10px 10px 40px; border:2px dashed rgba(43,36,25,.35); border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:14px; font-style:italic; }
  .slot { position:absolute; bottom:4px; width:92px; height:96px; display:flex; align-items:flex-end; justify-content:center; z-index:2;
    transform:translateX(-50%); }
  body.land .slot { height:118px; }
  body.land .slot img { max-height:118px; }
  .slot img { max-height:96px; max-width:92px; filter:drop-shadow(0 3px 3px rgba(0,0,0,.45)); transition:transform .25s; }
  .slot img.gray { filter:grayscale(1) drop-shadow(0 3px 3px rgba(0,0,0,.45)); transform:rotate(-8deg); }
  .slot .plus { width:46px; height:46px; margin-bottom:22px; border-radius:50%; border:2.5px dashed rgba(255,255,255,.85);
    color:#fff; font:bold 26px sans-serif; display:flex; align-items:center; justify-content:center; text-shadow:0 1px 3px #000;
    background:rgba(0,0,0,.18); }
  .badge { position:absolute; top:-4px; right:6px; font-size:20px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .beat { position:absolute; left:50%; top:46%; font-size:44px; transform:translate(-50%,-50%) scale(.2); opacity:0; z-index:4;
    animation:beat 1.1s ease-out forwards; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); pointer-events:none; }

  /* Лоток */
  #tray { position:absolute; left:0; right:0; top:452px; bottom:0; }
  #msg { position:absolute; left:12px; right:12px; top:0; height:22px; text-align:center; font-size:14px;
    font-style:italic; color:var(--maroon); transition:opacity .2s; }
  #scenes, #chars { position:absolute; left:8px; right:8px; display:flex; justify-content:space-around; }
  #scenes { top:24px; height:72px; }
  #chars { top:100px; height:84px; }
  .tok { position:relative; display:flex; flex-direction:column; align-items:center; cursor:grab; transition:opacity .2s, transform .15s; }
  .tok.sel { transform:translateY(-4px); }
  .tok.sel .pic { box-shadow:0 0 0 3px var(--gold); }
  .tok.used { opacity:.45; }
  .tok .name { font-size:11.5px; font-weight:bold; margin-top:3px; text-align:center; max-width:104px; line-height:1.05; }
  .scene .pic { width:100px; height:52px; border-radius:9px; overflow:hidden; border:2px solid var(--ink); }
  .scene .pic img { width:100%; height:100%; object-fit:cover; }
  .char .pic { width:62px; height:62px; border-radius:50%; overflow:hidden; border:2px solid var(--ink); background:var(--panel); }
  .char .pic img { width:100%; height:150%; object-fit:cover; object-position:top; }
  #ghost { position:absolute; z-index:50; pointer-events:none; transform:translate(-50%,-50%) scale(1.1); opacity:.92; display:none; }

  /* Рука-подсказка */
  #hand { position:absolute; z-index:40; font-size:38px; pointer-events:none; opacity:0; transition:opacity .3s;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }

  /* Финал */
  #end { position:absolute; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(30,18,26,.62); }
  #end .card { width:310px; background:var(--paper); border-radius:18px; padding:20px 20px 18px; text-align:center;
    border:3px solid var(--ink); box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 4px var(--edge); animation:pop .35s ease-out; }
  #end .icon { width:72px; height:72px; border-radius:16px; box-shadow:0 3px 8px rgba(0,0,0,.3); }
  #end h1 { font-size:24px; margin:10px 0 4px; }
  #end h2 { font-size:14px; margin:0 0 8px; color:var(--maroon); font-weight:bold; }
  #end p { font-size:13px; line-height:1.4; margin:0 0 14px; color:var(--ink); }
  #end .btn { display:block; width:100%; background:var(--maroon); color:var(--paper); font:bold 19px Georgia,serif;
    padding:14px; border-radius:30px; border:2.5px solid var(--ink); animation:pulse 1.4s infinite; cursor:pointer; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)}
    60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  @keyframes beat { 30%{opacity:1; transform:translate(-50%,-50%) scale(1.15)} 70%{opacity:1; transform:translate(-50%,-60%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-80%) scale(.9)} }
  @keyframes pop { from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
</style>
</head>
<body>
<div id="stage"><div class="page">
  <div id="head">
    <img class="icon" id="head-icon" alt="">
    <div class="txt"><div id="title"></div><div id="goal"></div></div>
    <div id="cta-top"></div>
  </div>
  <div id="frames"></div>
  <div id="tray"><div id="msg"></div><div id="scenes"></div><div id="chars"></div></div>
  <div id="ghost"></div>
  <div id="hand">👆</div>
  <div id="end"><div class="card">
    <img class="icon" id="end-icon" alt="">
    <h1 id="end-title"></h1><h2 id="end-goal"></h2><p id="end-fact"></p>
    <div class="btn" id="end-btn"></div>
  </div></div>
</div></div>

<script>/*__ENGINE__*/</script>
<script>
(function () {
  "use strict";
  var D = /*__DATA__*/null;
  var ENG = globalThis["engine-js"].teller.editor.Engine;
  var LEVEL = JSON.parse(D.level);
  var SCENES = {}; JSON.parse(D.scenes).forEach(function (s) { SCENES[s.id] = s; });
  var SOL = LEVEL.solution;
  var N = LEVEL.panels;

  var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
  var T = D.texts[lang] || D.texts.en;
  var isIOS = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent);

  // ---- Звук: только после первого касания (браузеры иначе блокируют) ----
  var audio = {}, soundOn = false;
  Object.keys(D.sounds).forEach(function (k) { var a = new Audio(D.sounds[k]); a.volume = 0.55; audio[k] = a; });
  // Реклама скрыта/закрыта — звук замолкает (требование AppLovin).
  var visible = true;
  function setVisible(v) { visible = v; if (!v) Object.keys(audio).forEach(function (k) { try { audio[k].pause(); } catch (e) {} }); }
  document.addEventListener("visibilitychange", function () { setVisible(!document.hidden); });
  function sfx(name) {
    if (!visible) return; if (!soundOn || !audio[name]) return; try { audio[name].currentTime = 0; audio[name].play(); } catch (e) {} }

  // ---- Установка: MRAID в рекламе, обычная ссылка в браузере ----
  function install() {
    var url = isIOS ? D.store.ios : D.store.android;
    try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
    window.open(url, "_blank");
  }

  // ---- Масштаб сцены 360×640 под любой экран ----
  var stage = document.getElementById("stage"), land = false, W = 360, H = 640;
  function fit() {
    land = window.innerWidth > window.innerHeight;
    document.body.classList.toggle("land", land);
    W = land ? 640 : 360; H = land ? 360 : 640;
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = "scale(" + s + ") translate(-50%,-50%)";
    layoutFrames();
  }
  function layoutFrames() {
    frameEls.forEach(function (el, i) {
      var r = land ? { l: 12 + i * 206, t: 62, w: 200, h: 168 } : { l: 12, t: 82 + i * 122, w: 336, h: 116 };
      el.style.left = r.l + "px"; el.style.top = r.t + "px"; el.style.width = r.w + "px"; el.style.height = r.h + "px";
    });
  }
  window.addEventListener("resize", function () { fit(); if (started) render(); });

  // ---- Состояние доски ----
  var panels = []; for (var i = 0; i < N; i++) panels.push({ scene: null, characters: [] });
  var result = null, prevEvents = {}, selected = null, done = false, lastTouch = 0, failCount = 0;

  function slotsOf(sceneId) { return sceneId ? (SCENES[sceneId].slots || 2) : 0; }
  function filled() { return panels.every(function (p) { return p.scene && p.characters.length === slotsOf(p.scene); }); }

  function simulate() {
    var res = JSON.parse(ENG.run(D.characters, D.scenes, D.rules, D.level, JSON.stringify(panels)));
    if (!res.ok) { console.warn(res.error); return; }
    result = res;
    // Движок подобрал порядок героев внутри кадров — показываем его.
    res.panels.forEach(function (p, i) { if (panels[i].scene) panels[i].characters = p.characters.slice(); });
  }

  // ---- Позы героев по флагам (как CharSprite в игре) ----
  var DEFEATED = ["fugitive", "defeated", "exiled", "cast_off", "widowed", "disgraced", "grieving"];
  var TRIUMPH = ["crowned", "reigns", "emperor", "empress", "victor", "conqueror", "triumphant", "honored",
    "beloved", "first_consul", "supreme_head", "absolute", "at_war"];
  function has(fl, list) { return list.some(function (f) { return fl.indexOf(f) >= 0; }); }
  function spriteFor(cid, flags) {
    var a = D.art, base = "char_" + cid;
    if (flags.indexOf("dead") >= 0) return a[base + "_dead"] ? { src: a[base + "_dead"] } : { src: a[base], gray: true };
    if (has(flags, DEFEATED) && a[base + "_defeated"]) return { src: a[base + "_defeated"] };
    if (has(flags, TRIUMPH) && a[base + "_triumph"]) return { src: a[base + "_triumph"] };
    if (flags.indexOf("plotting") >= 0 && a[base + "_plot"]) return { src: a[base + "_plot"] };
    return { src: a[base] };
  }
  function beatIcon(rule) {
    if (/crown|throne|reign/.test(rule)) return "👑";
    if (/battle|war|conquer/.test(rule)) return "⚔️";
    if (/love|marry|befriend|ally|friend/.test(rule)) return "🤝";
    if (/kill|murder|assass|execut|poison/.test(rule)) return "🗡️";
    return "✨";
  }

  // ---- Отрисовка ----
  var framesEl = document.getElementById("frames");
  var frameEls = [];
  for (var f = 0; f < N; f++) {
    var el = document.createElement("div");
    el.className = "frame"; el.dataset.frame = f;
    framesEl.appendChild(el); frameEls.push(el);
  }

  function renderFrames() {
    var events = {};
    (result ? result.events : []).forEach(function (e) { (events[e.panel] = events[e.panel] || []).push(e.rule); });
    panels.forEach(function (p, i) {
      var el = frameEls[i], html = '<div class="num">' + (i + 1) + "</div>";
      if (!p.scene) {
        html += '<div class="empty">' + T.drop + "</div>";
      } else {
        html += '<img class="bg" src="' + D.art["scene_" + p.scene] + '"><div class="shade"></div>' +
          '<div class="label">' + T.scenes[p.scene] + "<i>" + T.actions[p.scene] + "</i></div>" +
          '<div class="clear" data-clear="' + i + '">×</div>';
        var n = slotsOf(p.scene), flags = result && result.panels[i] ? result.panels[i].flags : {};
        for (var s = 0; s < n; s++) {
          var left = n === 1 ? "50%" : (s === 0 ? "28%" : "72%");
          var cid = p.characters[s];
          html += '<div class="slot" style="left:' + left + '">';
          if (cid) {
            var fl = flags[cid] || [], sp = spriteFor(cid, fl);
            html += '<img data-remove="' + i + ":" + cid + '" class="' + (sp.gray ? "gray" : "") + '" src="' + sp.src + '">';
            if (fl.indexOf("crowned") >= 0) html += '<div class="badge">👑</div>';
          } else html += '<div class="plus">+</div>';
          html += "</div>";
        }
      }
      el.innerHTML = html;
      // Новые сработавшие правила — короткий «бит» поверх кадра.
      var key = (events[i] || []).join(",");
      if (key && prevEvents[i] !== key) {
        (events[i] || []).forEach(function (rule, k) {
          var b = document.createElement("div"); b.className = "beat"; b.textContent = beatIcon(rule);
          b.style.animationDelay = (k * 0.25) + "s"; el.appendChild(b);
        });
        sfx("accent");
      }
      prevEvents[i] = key;
    });
  }

  var scenesEl = document.getElementById("scenes"), charsEl = document.getElementById("chars");
  function renderTray() {
    var usedScenes = panels.map(function (p) { return p.scene; });
    scenesEl.innerHTML = LEVEL.scenes.map(function (s) {
      var cls = "tok scene" + (usedScenes.indexOf(s) >= 0 ? " used" : "") + (selected && selected.id === s ? " sel" : "");
      return '<div class="' + cls + '" data-kind="scene" data-id="' + s + '"><div class="pic"><img src="' +
        D.art["scene_" + s] + '"></div><div class="name">' + T.scenes[s] + "</div></div>";
    }).join("");
    charsEl.innerHTML = LEVEL.characters.map(function (c) {
      var cls = "tok char" + (selected && selected.id === c ? " sel" : "");
      return '<div class="' + cls + '" data-kind="char" data-id="' + c + '"><div class="pic"><img src="' +
        D.art["char_" + c] + '"></div><div class="name">' + T.chars[c] + "</div></div>";
    }).join("");
  }

  var msgEl = document.getElementById("msg");
  function say(text) { msgEl.textContent = text; }
  function render() { renderFrames(); renderTray(); }

  // ---- Ходы ----
  function placeScene(i, sid) {
    var from = panels.findIndex(function (p) { return p.scene === sid; });
    if (from === i) return;
    if (from >= 0) {   // сцена переезжает вместе со своими героями
      var moved = panels[from]; panels[from] = panels[i].scene ? panels[i] : { scene: null, characters: [] }; panels[i] = moved;
    } else {
      panels[i] = { scene: sid, characters: panels[i].characters.slice(0, slotsOf(sid)) };
    }
    sfx("select"); changed();
  }
  function placeChar(i, cid) {
    var p = panels[i];
    if (!p.scene) { frameEls[i].classList.add("shake"); say(T.drag_scene); return; }
    if (p.characters.indexOf(cid) >= 0) return;
    if (p.characters.length >= slotsOf(p.scene)) p.characters.pop();   // полный кадр — заменяем последнего
    p.characters.push(cid); sfx("place"); changed();
  }
  function removeChar(i, cid) { panels[i].characters = panels[i].characters.filter(function (c) { return c !== cid; }); changed(); }
  function clearFrame(i) { panels[i] = { scene: null, characters: [] }; changed(); }

  function changed() {
    simulate(); render();
    if (done) return;
    if (filled()) {
      if (result && result.goalMet) { win(); return; }
      failCount++;
      frameEls.forEach(function (el) { el.classList.add("shake"); });
      say(failCount > 1 ? T.hint : T.again);
      sfx("error");
      setTimeout(showHint, 1600);
    } else {
      var anyScene = panels.some(function (p) { return p.scene; });
      say(anyScene ? T.drag_char : T.drag_scene);
    }
  }
  frameEls.forEach(function (el) { el.addEventListener("animationend", function () { el.classList.remove("shake"); }); });

  // ---- Перетаскивание и нажатия ----
  var ghost = document.getElementById("ghost"), drag = null;
  function stagePoint(ev) {
    var r = stage.getBoundingClientRect(), s = r.width / W;
    return { x: (ev.clientX - r.left) / s, y: (ev.clientY - r.top) / s };
  }
  function frameAt(ev) {
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    while (el && el !== document.body) { if (el.dataset && el.dataset.frame !== undefined) return +el.dataset.frame; el = el.parentNode; }
    return -1;
  }
  function apply(kind, id, i) { if (kind === "scene") placeScene(i, id); else placeChar(i, id); }

  document.addEventListener("pointerdown", function (ev) {
    var firstTap = !firstTouchAt;
    if (!soundOn) { soundOn = true; Object.keys(audio).forEach(function (k) { audio[k].load(); }); }
    touched();
    if (document.getElementById("end").style.display === "flex") return;
    var t = ev.target;
    // AppLovin: первое касание не должно уводить в стор.
    if (t.id === "cta-top") { if (!firstTap) install(); return; }
    if (t.dataset.clear !== undefined) { clearFrame(+t.dataset.clear); return; }
    if (t.dataset.remove) { var parts = t.dataset.remove.split(":"); removeChar(+parts[0], parts[1]); return; }
    var tok = t.closest(".tok");
    if (tok) {
      ev.preventDefault();
      drag = { kind: tok.dataset.kind, id: tok.dataset.id, x0: ev.clientX, y0: ev.clientY, moved: false };
      // Класс сцены/героя на призраке — иначе картинка теряет размер токена и раздувается.
      ghost.className = drag.kind;
      ghost.innerHTML = tok.querySelector(".pic").outerHTML;
      return;
    }
    var fi = frameAt(ev);
    if (fi >= 0 && selected) { apply(selected.kind, selected.id, fi); selected = null; renderTray(); }
  });
  document.addEventListener("dragstart", function (ev) { ev.preventDefault(); });
  document.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    drag.last = { clientX: ev.clientX, clientY: ev.clientY };
    if (!drag.moved && Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) > 8) { drag.moved = true; ghost.style.display = "block"; }
    if (!drag.moved) return;
    var p = stagePoint(ev); ghost.style.left = p.x + "px"; ghost.style.top = p.y + "px";
    var fi = frameAt(ev);
    frameEls.forEach(function (el, k) { el.classList.toggle("hover", k === fi); });
  });
  function endDrag(ev) {
    if (!drag) return;
    ghost.style.display = "none";
    frameEls.forEach(function (el) { el.classList.remove("hover"); });
    if (drag.moved) {
      var fi = frameAt(ev); if (fi >= 0) apply(drag.kind, drag.id, fi);
      selected = null;
    } else {
      // Нажатие: выбрать токен, потом нажать на кадр (или сразу в первый подходящий кадр).
      selected = (selected && selected.id === drag.id) ? null : { kind: drag.kind, id: drag.id };
    }
    drag = null; renderTray();
  }
  document.addEventListener("pointerup", endDrag);
  // Система отменила жест (скролл/жест ОС) — бросаем туда, где палец был последний раз.
  document.addEventListener("pointercancel", function () { if (drag && drag.last) endDrag(drag.last); else if (drag) { ghost.style.display = "none"; drag = null; } });

  // ---- Рука-подсказка: следующий шаг к эталонному решению ----
  var hand = document.getElementById("hand"), handTimer = null;
  function nextStep() {
    for (var i = 0; i < N; i++) {
      var want = SOL[i], have = panels[i];
      if (have.scene !== want.scene) return { from: '[data-kind="scene"][data-id="' + want.scene + '"]', to: i };
      var wrong = have.characters.filter(function (c) { return want.characters.indexOf(c) < 0; });
      if (wrong.length) return { tap: '[data-remove="' + i + ":" + wrong[0] + '"]' };
      var missing = want.characters.filter(function (c) { return have.characters.indexOf(c) < 0; });
      if (missing.length) return { from: '[data-kind="char"][data-id="' + missing[0] + '"]', to: i };
    }
    return null;
  }
  function center(el) {
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect(), s = sr.width / W;
    return { x: (r.left + r.width / 2 - sr.left) / s, y: (r.top + r.height / 2 - sr.top) / s };
  }
  function showHint() {
    if (done) return;
    var step = nextStep(); if (!step) return;
    var a = document.querySelector(step.tap || step.from); if (!a) return;
    var pa = center(a), pb = step.tap ? pa : center(frameEls[step.to]);
    var t0 = performance.now();
    cancelAnimationFrame(handTimer);
    hand.style.opacity = 1;
    (function loop(now) {
      var k = ((now - t0) % 1800) / 1800, e = k < .15 ? 0 : k > .75 ? 1 : (k - .15) / .6;
      e = e < .5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
      hand.style.left = (pa.x + (pb.x - pa.x) * e - 8) + "px";
      hand.style.top = (pa.y + (pb.y - pa.y) * e - 4) + "px";
      hand.style.transform = "scale(" + (k < .15 || k > .75 ? 0.9 : 1) + ")";
      handTimer = requestAnimationFrame(loop);
    })(t0);
  }
  function hideHint() { cancelAnimationFrame(handTimer); hand.style.opacity = 0; }
  function touched() { lastTouch = Date.now(); if (!firstTouchAt) firstTouchAt = lastTouch; hideHint(); }
  setInterval(function () { if (!done && Date.now() - lastTouch > 5000) { lastTouch = Date.now(); showHint(); } }, 500);

  // ---- Финал ----
  var endEl = document.getElementById("end");
  function showEnd(won) {
    document.getElementById("end-title").textContent = won ? T.win : T.title;
    document.getElementById("end-goal").textContent = "👑 " + T.goal;
    document.getElementById("end-fact").textContent = won ? T.fact : T.hint;
    endEl.style.display = "flex";
  }
  function win() {
    done = true; hideHint(); say("");
    frameEls.forEach(function (el, k) { setTimeout(function () { el.classList.add("win"); }, k * 200); });
    sfx("win");
    setTimeout(function () { showEnd(true); }, 1500);
  }
  endEl.addEventListener("pointerdown", function () { install(); });
  // Финал без победы — через 60 с с первого касания (AppLovin: таймер стартует только после
  // взаимодействия). Пока игрок в процессе, окно стора не выскакивает.
  var firstTouchAt = 0;
  function forceEnd() { if (!done) { done = true; hideHint(); showEnd(false); } }
  setInterval(function () {
    if (!done && firstTouchAt && Date.now() - firstTouchAt > 60000) forceEnd();
  }, 1000);

  // ---- Старт ----
  function start() {
    document.getElementById("head-icon").src = D.art.icon;
    document.getElementById("end-icon").src = D.art.icon;
    document.getElementById("title").textContent = T.title;
    document.getElementById("goal").innerHTML = '<span class="crown">👑</span> ' + T.goal;
    document.getElementById("cta-top").textContent = T.play;
    document.getElementById("end-btn").textContent = T.play;
    startedAt = Date.now();
    fit(); simulate(); render(); say(T.drag_scene);
    lastTouch = Date.now();
    setTimeout(showHint, 700);
  }
  var started = false, startedAt = 0;
  function boot() { if (!started) { started = true; start(); } }
  function mraidReady() {
    mraid.addEventListener("viewableChange", function (v) { setVisible(v); if (v) boot(); });
    if (mraid.isViewable()) boot();
  }
  if (window.mraid) {
    if (mraid.getState() === "loading") mraid.addEventListener("ready", mraidReady); else mraidReady();
  } else if (document.readyState === "complete") boot();
  else window.addEventListener("load", boot);
})();
</script>
</body>
</html>
