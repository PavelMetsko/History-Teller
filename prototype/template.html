<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>History Teller</title>
<style>
  :root {
    --bg-dark: #241a12;     /* тьма вокруг книги */
    --page: #e9d9b6;        /* пергаментный лист */
    --panel-paper: #f2e7ca;
    --sepia: #8a6a48;       /* линии рамок */
    --ink-text: #4a3622;
    --accent: #a8762a;
    --muted: #9b8266;
    --btn: #6e4f33;
    --btn-text: #f2e7ca;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-dark);
    font-family: Georgia, 'Times New Roman', serif; touch-action: manipulation; overflow: hidden;
    color: var(--ink-text); }

  .rotate { display: none; position: fixed; inset: 0; background: var(--bg-dark); z-index: 50;
    align-items: center; justify-content: center; text-align: center; font-size: 20px;
    color: var(--page); padding: 30px; }
  @media (orientation: portrait) { .rotate { display: flex; } }

  /* пергаментный лист */
  .page { position: fixed;
    top: max(8px, env(safe-area-inset-top)); bottom: max(8px, env(safe-area-inset-bottom));
    left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
    background: var(--page); border-radius: 16px;
    box-shadow: inset 0 0 70px rgba(74,53,32,.4), 0 6px 30px rgba(0,0,0,.5);
    display: flex; flex-direction: row; padding: 12px 14px; gap: 10px; }
  /* зерно бумаги */
  .page::before { content: ''; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.06"/></svg>'); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 1; }

  /* ---- шапка ---- */
  header { position: relative; height: 88px; flex: none; }
  .nav-btn, .tool-btn { position: absolute; background: var(--btn); border: none; color: var(--btn-text);
    border-radius: 11px; cursor: pointer; font-family: inherit; }
  #prevBtn { left: 4px; top: 8px; width: 54px; height: 48px; font-size: 26px; }
  #resetBtn { right: 66px; top: 8px; height: 44px; padding: 0 14px; font-size: 16px; }
  #hintBtn { right: 4px; top: 8px; width: 48px; height: 44px; font-size: 20px;
    background: var(--accent); font-weight: bold; }
  h1 { position: absolute; left: 70px; right: 190px; top: 0; margin: 0; font-size: 26px;
    font-style: italic; text-align: center; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--ink-text); }
  .goal { position: absolute; left: 70px; right: 190px; top: 36px; display: flex;
    align-items: center; justify-content: center; gap: 7px; font-size: 16px;
    font-style: italic; color: var(--ink-text); white-space: nowrap; overflow: hidden; }
  .goal img { width: 21px; height: 21px; flex: none; }
  .info { position: absolute; left: 70px; right: 190px; top: 64px; font-size: 12px;
    color: var(--muted); font-style: italic; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  /* ---- кадры-панели: тонкая сепия-рамка прямо на бумаге ---- */
  .panels { flex: 1; display: flex; gap: 14px; justify-content: center; align-items: center; min-height: 0; }
  .panel { position: relative; border: 3px solid var(--sepia); border-radius: 10px;
    background: var(--panel-paper); width: 240px; height: 100%; max-height: 380px;
    cursor: pointer; flex: none; overflow: hidden; }
  .panel-in { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 6px 7px;
    background-position: center top; background-size: cover; }
  .panel-clear { position: absolute; top: 6px; right: 6px; z-index: 3;
    background: rgba(160,74,58,.9); color: var(--btn-text); border: none;
    width: 26px; height: 26px; border-radius: 8px; font-size: 14px; cursor: pointer;
    display: none; }
  .panel.filled .panel-clear { display: block; }
  .empty-hint { position: absolute; inset: 30% 10% 35% 10%; display: flex; align-items: center;
    justify-content: center; text-align: center; color: var(--muted); font-style: italic;
    font-size: 16px; pointer-events: none; }
  .action-ghost { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
    width: 76px; height: 76px; opacity: .35; pointer-events: none; }
  .action-name { position: absolute; left: 0; right: 0; top: 60%; text-align: center;
    color: var(--muted); font-style: italic; font-size: 15px; pointer-events: none; }
  /* постановка кадра: фигуры в слотах-ролях */
  .stage { position: absolute; inset: 8px 4px 22px; pointer-events: none; }
  .figure { position: absolute; bottom: 18px; width: 45%; height: 58%; cursor: pointer;
    pointer-events: auto; display: flex; flex-direction: column; }
  .figure.s0 { left: 3%; } .figure.s1 { right: 3%; }
  .figure.s2 { left: 27.5%; bottom: 52%; height: 44%; }
  .figure img.body { flex: 1; min-height: 0; width: 100%; object-fit: contain; pointer-events: none; }
  .figure.mir img.body { transform: scaleX(-1); }
  .figure.dead { transform: rotate(90deg); filter: grayscale(.9); opacity: .85; bottom: 2px; }
  .figure .fnm { font-size: 11px; font-style: italic; text-align: center; line-height: 1; }
  .figure .ictop { position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 24px; }
  .pair-ic { position: absolute; width: 30px; height: 30px; pointer-events: none; }
  .slotph { position: absolute; bottom: 18px; width: 41%; height: 55%;
    border: 2px dashed rgba(110,79,51,.35); border-radius: 10px; display: flex;
    flex-direction: column; align-items: center; justify-content: flex-end;
    color: var(--muted); font-style: italic; font-size: 12px; padding-bottom: 4px;
    pointer-events: none; }
  .slotph .plus { font-size: 30px; opacity: .5; margin: auto; }
  .slotph.s0 { left: 5%; } .slotph.s1 { right: 5%; }
  .slotph.s2 { left: 29.5%; bottom: 54%; height: 40%; }
  .panel-swap { position: absolute; top: 6px; left: 6px; z-index: 3;
    background: rgba(110,79,51,.85); color: var(--btn-text); border: none;
    width: 32px; height: 26px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .slots { text-align: center; font-size: 13px; color: var(--ink-text); font-style: italic;
    min-height: 17px; flex: none; }
  .tray-item .lbl .act { display: block; font-size: 11px; color: var(--muted); }

  .hint-line { text-align: center; color: var(--accent); font-size: 16px; font-weight: bold;
    font-style: italic; min-height: 20px; flex: none; }

  /* ---- боковой трей с миниатюрами ---- */
  .tray { display: flex; gap: 8px; flex: none; position: relative; z-index: 1; }
  .tray-col { width: 106px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    overflow-y: auto; }
  .tray-col-label { font-size: 13px; color: var(--muted); font-style: italic; flex: none; }
  .tray-item { width: 100px; border-radius: 10px; padding: 4px 2px 2px; cursor: grab;
    display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none;
    background: transparent; border: none; font-family: inherit; flex: none; }
  .tray-item.selected { background: rgba(168,118,42,.3); box-shadow: 0 0 0 2px var(--accent); }
  .tray-item .thumb { width: 84px; height: 64px; border: 2px solid var(--sepia); border-radius: 7px;
    background-size: cover; background-position: center top; pointer-events: none; }
  .tray-item .portrait { width: 70px; height: 64px; object-fit: contain; pointer-events: none; }
  .tray-item .lbl { font-size: 13px; font-style: italic; color: var(--ink-text); text-align: center;
    line-height: 1; pointer-events: none; }

  .ghost { position: fixed; width: 104px; height: 104px; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 40; display: flex; align-items: center; justify-content: center; }
  .ghost img { width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.4)); }

  /* ---- победа ---- */
  .overlay { position: fixed; inset: 0; background: rgba(26,18,10,.85); display: none;
    align-items: center; justify-content: center; padding: 18px; z-index: 10; }
  .overlay.show { display: flex; animation: fadein .3s; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  .card { background: var(--panel-paper); border-radius: 14px; max-width: 580px; max-height: 90vh;
    overflow-y: auto; padding: 20px 26px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    animation: pop .35s; }
  @keyframes pop { from { transform: scale(.85); opacity: .4 } to { transform: scale(1); opacity: 1 } }
  .card h2 { margin: 0 0 4px; font-style: italic; font-size: 25px; color: var(--ink-text); }
  .acc { display: inline-block; font-size: 12px; padding: 3px 12px; border-radius: 999px;
    margin: 4px 0 8px; color: #fff; font-weight: bold; }
  .acc.fact { background: #5d7a3a; } .acc.simplification { background: #a07a2a; } .acc.legend { background: #7a4a7a; }
  .card p { font-size: 15px; line-height: 1.4; margin: 0 0 8px; user-select: text; -webkit-user-select: text; }
  .card .src { font-size: 13px; color: var(--muted); font-style: italic; }
  .card .btns { display: flex; gap: 10px; margin-top: 12px; }
  .card .btns button { border: none; border-radius: 10px; padding: 12px 22px; font-size: 16px;
    font-family: inherit; cursor: pointer; }
  .b-dark { background: var(--btn); color: var(--btn-text); }
  .b-gold { background: var(--accent); color: var(--btn-text); font-weight: bold; }

  .float-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(74,53,30,.9); color: #ecd9a8; font-weight: bold; font-style: italic;
    font-size: 17px; padding: 6px 16px; border-radius: 9px; pointer-events: none; z-index: 5;
    animation: floatup .9s forwards; }
  /* промах: действие ничего не дало */
  .float-label.miss { background: rgba(150,48,40,.92); color: #f6ddca;
    animation: missfade 1.1s forwards; }
  @keyframes missfade { 0% { opacity: 0; transform: translate(-50%,-44%) scale(.85) }
    18% { opacity: 1; transform: translate(-50%,-50%) scale(1) }
    78% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%,-54%) } }
  .panel.misfire { animation: panelmiss .5s; }
  @keyframes panelmiss { 0%,100% { box-shadow: none } 40% { box-shadow: inset 0 0 0 3px rgba(176,64,52,.9) } }
  @keyframes floatup { from { opacity: 1; margin-top: 0 } to { opacity: 0; margin-top: -70px } }
  @keyframes popin { from { transform: scale(.3) } to { transform: scale(1) } }
  .pop { animation: popin .25s; }
  @keyframes shake { 0%,100% { translate: 0 0 } 20% { translate: -5px 2px } 40% { translate: 5px -2px }
    60% { translate: -4px -1px } 80% { translate: 3px 1px } }
  .shake { animation: shake .35s; }
</style>
</head>
<body>
<div class="rotate">Поверните устройство горизонтально 🔁</div>
<div class="page">
  <div class="main">
    <header>
      <button class="nav-btn" id="prevBtn">‹</button>
      <h1 id="title"></h1>
      <div class="goal"><img id="goalBox"><span id="goalText"></span></div>
      <div class="info" id="info"></div>
      <button class="tool-btn" id="resetBtn">Сброс</button>
      <button class="tool-btn" id="hintBtn">?</button>
    </header>
    <div class="panels" id="panels"></div>
    <div class="hint-line" id="hintText"></div>
  </div>
  <div class="tray">
    <div class="tray-col"><div class="tray-col-label">сцены</div><div id="sceneChips" style="display:contents"></div></div>
    <div class="tray-col"><div class="tray-col-label">персонажи</div><div id="charChips" style="display:contents"></div></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2>История сложилась!</h2>
    <span class="acc" id="accBadge"></span>
    <p id="factText"></p>
    <div class="src" id="factSource"></div>
    <div class="btns">
      <button class="b-dark" id="againBtn">Ещё раз</button>
      <button class="b-gold" id="nextLevelBtn">Дальше →</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ============ ДВИЖОК (семантика 1:1 с tools/simulate.py / Engine.cs / proto/engine.js) ============
function newWorld(){return{flags:{},relations:new Set()}}
function relKey(r,f,t){return r+'|'+f+'|'+t}
function hasFlag(w,c,f){return!!(w.flags[c]&&w.flags[c].has(f))}
function setFlag(w,c,f){(w.flags[c]=w.flags[c]||new Set()).add(f)}
function removeFlag(w,c,f){if(w.flags[c])w.flags[c].delete(f)}
function hasRel(w,r,f,t){return w.relations.has(relKey(r,f,t))}
function isAlive(w,c){return!hasFlag(w,c,'dead')}
function initialWorld(level){
  const w=newWorld();
  const init=(level&&level.initialState)||{};
  for(const c in (init.flags||{}))for(const f of init.flags[c])setFlag(w,c,f);
  for(const[r,f,t]of(init.relations||[]))w.relations.add(relKey(r,f,t));
  return w}
function actorMatches(a,ch,b,w,defs){
  const d=defs[ch];
  for(const t of a.tags||[])if(!d.tags.includes(t))return false;
  for(const f of a.flags||[])if(!hasFlag(w,ch,f))return false;
  for(const f of a.notFlags||[])if(hasFlag(w,ch,f))return false;
  for(const rc of a.relations||[]){const o=b[rc.to];if(!o||!hasRel(w,rc.rel,ch,o))return false}
  return true}
function*permutations(items,k){
  if(k===0){yield[];return}
  if(k>items.length)return;
  for(let i=0;i<items.length;i++){
    const rest=items.slice(0,i).concat(items.slice(i+1));
    for(const tail of permutations(rest,k-1))yield[items[i],...tail]}}
function findBindings(actors,present,w,defs){
  const alive=present.filter(c=>isAlive(w,c));
  const slotted=actors.filter(a=>a.slot!==undefined&&a.slot!==null);
  if(slotted.length){
    const binding={},used=new Set();
    for(const a of slotted){
      if(a.slot>=present.length)return[];
      const c=present[a.slot];
      if(!isAlive(w,c)||used.has(c))return[];
      binding[a.var]=c;used.add(c)}
    const rest=actors.filter(a=>a.slot===undefined||a.slot===null);
    const free=alive.filter(c=>!used.has(c));
    const out=[];
    for(const perm of permutations(free,rest.length)){
      const b={...binding};
      rest.forEach((a,i)=>{b[a.var]=perm[i]});
      if(actors.every(a=>actorMatches(a,b[a.var],b,w,defs)))out.push(b)}
    return out}
  const out=[];
  for(const perm of permutations(alive,actors.length)){
    const b={};actors.forEach((a,i)=>{b[a.var]=perm[i]});
    if(actors.every(a=>actorMatches(a,b[a.var],b,w,defs)))out.push(b)}
  return out}
function applyEffects(effects,b,w){
  for(const e of effects){
    if(e.type==='setFlag')setFlag(w,b[e.target],e.flag);
    else if(e.type==='removeFlag')removeFlag(w,b[e.target],e.flag);
    else if(e.type==='addRelation')w.relations.add(relKey(e.rel,b[e.from],b[e.to]));
    else if(e.type==='removeRelation')w.relations.delete(relKey(e.rel,b[e.from],b[e.to]))}}
function snapshotWorld(w){
  const flags={};for(const c in w.flags)flags[c]=new Set(w.flags[c]);
  return{flags,relations:new Set(w.relations)}}
function simulate(panels,content,log,snapshots,initial){
  const w=initial||newWorld();
  panels.forEach((p,i)=>{
    if(p&&p.sceneId){
      const sceneTags=content.scenes[p.sceneId].tags;
      for(const rule of content.rulesByPriorityDesc){
        if(!(rule.trigger.sceneTags||[]).every(t=>sceneTags.includes(t)))continue;
        for(const b of findBindings(rule.trigger.actors,p.characters,w,content.characters)){
          const ok=rule.trigger.actors.every(a=>isAlive(w,b[a.var])&&actorMatches(a,b[a.var],b,w,content.characters));
          if(!ok)continue;
          applyEffects(rule.effects,b,w);
          if(log)log.push({panel:i,rule:rule.id,binding:{...b}})}}}
    if(snapshots)snapshots.push(snapshotWorld(w))});
  return w}
function goalMet(g,w){
  if(g.all)return g.all.every(x=>goalMet(x,w));
  if(g.any)return g.any.some(x=>goalMet(x,w));
  if(g.not)return!goalMet(g.not,w);
  if(g.flag)return hasFlag(w,g.flag.char,g.flag.is);
  if(g.relation)return hasRel(w,g.relation.rel,g.relation.from,g.relation.to);
  return false}
function*combinations(items,k){
  if(k===0){yield[];return}
  for(let i=0;i<=items.length-k;i++)
    for(const tail of combinations(items.slice(i+1),k-1))yield[items[i],...tail]}
function solve(level,content,maxSolutions){
  const opts=[];
  for(const sid of level.scenes){
    const slots=content.scenes[sid].slots||2;
    for(let k=0;k<=Math.min(slots,level.characters.length);k++)
      for(const perm of permutations(level.characters,k))opts.push({sceneId:sid,characters:perm})}
  const n=level.panels,solutions=[],idx=new Array(n).fill(0);
  while(true){
    const a=idx.map(i=>opts[i]);
    if(goalMet(level.goal,simulate(a,content,null,null,initialWorld(level))))
      {solutions.push(a);if(maxSolutions&&solutions.length>=maxSolutions)break}
    let pos=n-1;
    while(pos>=0&&++idx[pos]===opts.length)idx[pos--]=0;
    if(pos<0)break}
  return solutions}

// ============ КОНТЕНТ (инжектируется сборкой: tools/build_proto.py) ============
const DATA = /*__DATA__*/null;
if(!DATA){document.body.innerHTML='<p style="padding:40px;text-align:center;color:#e9d9b6">Это шаблон. Соберите прототип: python3 tools/build_proto.py</p>';throw new Error('template not built')}
const ACC_LABEL={fact:'Факт',simplification:'Упрощение',legend:'Легенда'};
const RULE_LABEL={befriend:'союз',conspire:'заговор',charm:'любовь',rivals:'зависть',
  betrayal_kill:'убит!',battle_justice:'возмездие',offer_crown:'корона'};
const byId=a=>Object.fromEntries(a.map(x=>[x.id,x]));
const CONTENT={characters:byId(DATA.characters),scenes:byId(DATA.scenes),
  rulesByPriorityDesc:[...DATA.rules].sort((a,b)=>(b.priority||0)-(a.priority||0))};
const LEVELS=[...DATA.levels].sort((a,b)=>(a.order||0)-(b.order||0));

function idColor(id,s,l){
  let h=17;for(const ch of id)h=(h*31+ch.charCodeAt(0))|0;
  return`hsl(${Math.abs(h%360)},${s}%,${l}%)`}
function artUri(name){
  const b=(DATA.art||{})[name];
  return b?'data:image/svg+xml;base64,'+b:null}
function initials(name){
  const w=name.split(' ');
  return w.length>=2?(w[0][0]+w[w.length-1][0]).toUpperCase():name.slice(0,2).toUpperCase()}

// ============ СОСТОЯНИЕ UI ============
let levelIdx=0, panels=[], selected=null, solvedShown=false;
const $=id=>document.getElementById(id);

function level(){return LEVELS[levelIdx]}
function resetLevel(){
  panels=Array.from({length:level().panels},()=>({sceneId:null,characters:[]}));
  selected=null;solvedShown=false;$('hintText').textContent='';
  $('overlay').classList.remove('show');
  render()}

function badgeIcons(snap,c,present){
  if(hasFlag(snap,c,'dead'))return['icon_dead'];
  const p=[];
  if(hasFlag(snap,c,'crowned'))p.push('icon_crown');
  if(hasFlag(snap,c,'plotting'))p.push('icon_plotting');
  for(const o of present)if(o!==c&&hasRel(snap,'loves',c,o)){p.push('icon_love');break}
  for(const o of present)if(o!==c&&hasRel(snap,'envies',c,o)){p.push('icon_envy');break}
  if(!p.length)for(const o of present)if(o!==c&&hasRel(snap,'ally_of',c,o)){p.push('icon_ally');break}
  return p.slice(0,2)}
function badgesHtml(snap,c,present){
  return badgeIcons(snap,c,present)
    .map(n=>{const u=artUri(n);return u?'<img src="'+u+'">':''}).join('')}

function render(changedPanel=-1,addedChar=null){
  const lv=level();
  $('title').textContent='«'+lv.title+'»';
  $('goalText').textContent=lv.goalText||lv.title;
  $('goalBox').src=artUri(solvedShown?'icon_box_done':'icon_box')||'';
  $('info').textContent=[lv.initialText,lv.goalHint].filter(Boolean)
    .map(s=>'○ '+s).join('    ');
  $('prevBtn').disabled=false;

  const snaps=[],events=[];
  const world=simulate(panels,CONTENT,events,snaps,initialWorld(lv));

  const pc=$('panels');pc.innerHTML='';
  panels.forEach((p,i)=>{
    const scene=p.sceneId?CONTENT.scenes[p.sceneId]:null;
    const snap=snaps[i]||newWorld();
    const sceneArt=p.sceneId?artUri('scene_'+p.sceneId):null;
    const el=document.createElement('div');
    el.className='panel'+(p.sceneId||p.characters.length?' filled':'');
    el.id='panel'+i;
    let html='<div class="panel-in"'+(sceneArt?
      ' style="background-image:linear-gradient(rgba(242,231,202,.25),rgba(242,231,202,.25)),url('+sceneArt+')"':'')+'>';
    html+='<button class="panel-clear" data-clear="'+i+'">×</button>';
    if(p.characters.length>=2)html+='<button class="panel-swap" data-swap="'+i+'">⇄</button>';
    if(!scene)html+='<div class="empty-hint">перетащите<br>сюда сцену</div>';
    else if(p.characters.length===0&&!scene.roles){
      const gi=scene.actionIcon?artUri(scene.actionIcon):null;
      if(gi)html+='<img class="action-ghost" src="'+gi+'">';
      if(scene.action)html+='<div class="action-name">'+scene.action+'</div>'}
    // постановка: фигуры в слотах-ролях
    html+='<div class="stage">';
    const slotsN=scene?scene.slots:0;
    const roles=scene?(scene.roles||[]):[];
    for(let s=0;s<slotsN;s++){
      if(s<p.characters.length){
        const c=p.characters[s];
        const def=CONTENT.characters[c];
        const dead=hasFlag(snap,c,'dead');
        let emo='';
        if(!dead){
          if(p.characters.some(o=>o!==c&&hasRel(snap,'loves',c,o)))emo='_love';
          else if(hasFlag(snap,c,'plotting'))emo='_plot';
        }
        const art=artUri('char_'+c+emo)||artUri('char_'+c);
        let top='';
        if(!dead&&hasFlag(snap,c,'crowned'))top=artUri('icon_crown')||'';
        else if(!dead&&hasFlag(snap,c,'plotting'))top=artUri('icon_plotting')||'';
        html+='<div class="figure s'+s+(s===1?' mir':'')+(dead?' dead':'')+'"'+
          ' data-rm="'+i+':'+c+'" id="tile_'+i+'_'+c+'">'+
          (top?'<img class="ictop" src="'+top+'">':'')+
          (art?'<img class="body" src="'+art+'" draggable="false">':'')+
          '<div class="fnm">'+def.name+'</div></div>'}
      else{
        html+='<div class="slotph s'+s+'"><div class="plus">+</div>'+(roles[s]||'')+'</div>'}}
    // пиктограммы отношений между парами
    const xs2=[26.5,73.5,50];
    for(let a=0;a<p.characters.length&&a<slotsN;a++)
      for(let b=a+1;b<p.characters.length&&b<slotsN;b++){
        const ca=p.characters[a],cb=p.characters[b];
        const ics=[];
        if(hasRel(snap,'loves',ca,cb)||hasRel(snap,'loves',cb,ca))ics.push('icon_love');
        if(hasRel(snap,'envies',ca,cb)||hasRel(snap,'envies',cb,ca))ics.push('icon_envy');
        if(!ics.length&&(hasRel(snap,'ally_of',ca,cb)||hasRel(snap,'ally_of',cb,ca)))ics.push('icon_ally');
        const midL=((xs2[a]+xs2[b])/2);
        const midT=(b===2)?24:36;
        ics.slice(0,2).forEach((n,k)=>{
          const u=artUri(n);
          if(u)html+='<img class="pair-ic" src="'+u+'" style="left:calc('+midL+'% - 15px);top:calc('+midT+'% - '+(k*34)+'px)">'})}
    html+='</div>';
    html+='<div class="slots">'+(scene?scene.name+' · '+p.characters.length+'/'+scene.slots:'')+'</div></div>';
    el.innerHTML=html;
    el.addEventListener('click',ev=>onPanelTap(ev,i));
    pc.appendChild(el)});

  // боковой трей: миниатюры с подписями
  const sc=$('sceneChips');sc.innerHTML='';
  for(const sid of lv.scenes){
    const s=CONTENT.scenes[sid];
    const b=document.createElement('button');
    const sel=selected&&selected.type==='scene'&&selected.id===sid;
    b.className='tray-item'+(sel?' selected':'');
    const art=artUri('scene_'+sid);
    b.innerHTML='<div class="thumb" style="'+(art?'background-image:url('+art+')':'background:'+idColor(sid,40,55))+'"></div>'+
      '<div class="lbl">'+s.name+(s.action?'<span class="act">'+s.action+'</span>':'')+'</div>';
    b.addEventListener('pointerdown',e=>startDrag(e,'scene',sid));
    sc.appendChild(b)}

  const cc=$('charChips');cc.innerHTML='';
  for(const cid of lv.characters){
    const c=CONTENT.characters[cid];
    const b=document.createElement('button');
    const sel=selected&&selected.type==='char'&&selected.id===cid;
    b.className='tray-item'+(sel?' selected':'');
    const art=artUri('char_'+cid);
    b.innerHTML=(art?'<img class="portrait" src="'+art+'" draggable="false">':
      '<div class="thumb" style="background:'+idColor(cid,40,62)+'"></div>')+
      '<div class="lbl">'+c.name+'</div>';
    b.addEventListener('pointerdown',e=>startDrag(e,'char',cid));
    cc.appendChild(b)}

  if(changedPanel>=0)animateAction(changedPanel,addedChar,events,snaps[changedPanel]);
  if(!solvedShown&&goalMet(lv.goal,world)){solvedShown=true;winSequence(events)}}

function toggleSel(type,id){
  return selected&&selected.type===type&&selected.id===id?null:{type,id}}

function dropOnPanel(i,kind,id){
  const p=panels[i];
  if(kind==='scene'){
    p.sceneId=id;
    p.characters=p.characters.slice(0,CONTENT.scenes[id].slots);
    selected=null;render(i,null)}
  else{
    if(!p.sceneId){flashHint('Сначала поместите сцену в кадр');return}
    if(p.characters.includes(id)){flashHint('Этот персонаж уже здесь');return}
    if(p.characters.length>=CONTENT.scenes[p.sceneId].slots){flashHint('В этой сцене нет места');return}
    p.characters.push(id);
    render(i,id)}}

function onPanelTap(ev,i){
  const rm=ev.target.closest('[data-rm]');
  const clr=ev.target.closest('[data-clear]');
  const sw=ev.target.closest('[data-swap]');
  if(sw){
    const list=panels[i].characters;
    if(list.length===2)panels[i].characters=[list[1],list[0]];
    else if(list.length>2){const f=list.shift();list.push(f)}
    render(i,null);return}
  if(clr){panels[i]={sceneId:null,characters:[]};render();return}
  if(rm){const[pi,c]=rm.dataset.rm.split(':');
    panels[pi].characters=panels[pi].characters.filter(x=>x!==c);render();return}
  if(!selected)return;
  const k=selected.type,id=selected.id;
  if(k==='scene')selected=null;
  dropOnPanel(i,k,id)}

// ---- drag & drop ----
let drag=null;
function startDrag(e,kind,id){
  e.preventDefault();
  drag={kind,id,ghost:null,moved:false,x:e.clientX,y:e.clientY}}
function makeGhost(kind,id){
  const g=document.createElement('div');
  g.className='ghost';
  const art=artUri((kind==='scene'?'scene_':'char_')+id);
  if(art)g.innerHTML='<img src="'+art+'">';
  else{g.textContent=kind==='scene'?CONTENT.scenes[id].name:CONTENT.characters[id].name;
    g.style.background=idColor(id,40,55);g.style.borderRadius='12px'}
  document.body.appendChild(g);
  return g}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<10)return;
    drag.moved=true;
    drag.ghost=makeGhost(drag.kind,drag.id)}
  drag.ghost.style.left=e.clientX+'px';
  drag.ghost.style.top=e.clientY+'px'});
document.addEventListener('pointerup',e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(d.ghost){
    d.ghost.remove();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const panel=el&&el.closest('.panel');
    if(panel)dropOnPanel(+panel.id.slice(5),d.kind,d.id)}
  else{selected=toggleSel(d.kind,d.id);render()}});
document.addEventListener('pointercancel',()=>{
  if(drag&&drag.ghost)drag.ghost.remove();drag=null});

function floatLabel(panelEl,text,cls){
  const f=document.createElement('div');
  f.className='float-label'+(cls?' '+cls:'');
  f.textContent=text;
  panelEl.appendChild(f);
  setTimeout(()=>f.remove(),1100)}

// почему действие в кадре не сработало — короткая подсказка игроку
function misfireReason(panelIdx,snap){
  const p=panels[panelIdx];
  const scene=p.sceneId?CONTENT.scenes[p.sceneId]:null;
  if(!scene)return null;
  if(p.characters.length<2)return null;           // ещё не собрана пара — это не промах
  for(const c of p.characters)
    if(snap&&hasFlag(snap,c,'locked_out'))return 'Её не впускают сюда';
  return 'Здесь ничего не складывается'}

function animateAction(panelIdx,addedChar,events,snap){
  const panelEl=$('panel'+panelIdx);
  if(!panelEl)return;
  if(addedChar){const t=$('tile_'+panelIdx+'_'+addedChar);if(t)t.classList.add('pop')}
  const seen=new Set();
  const local=events.filter(e=>e.panel===panelIdx)
    .filter(e=>{const k=e.rule+'|'+Object.values(e.binding).sort().join(',');
      return seen.has(k)?false:(seen.add(k),true)});
  // действие собрано, но ни одно правило не сработало → анимированный «промах»
  if(addedChar&&local.length===0){
    const why=misfireReason(panelIdx,snap);
    if(why){
      panelEl.classList.remove('misfire');void panelEl.offsetWidth;panelEl.classList.add('misfire');
      const tile=$('tile_'+panelIdx+'_'+addedChar);
      if(tile){tile.classList.remove('shake');void tile.offsetWidth;tile.classList.add('shake')}
      setTimeout(()=>floatLabel(panelEl,why,'miss'),140)}}
  local.forEach((ev,k)=>{
    setTimeout(()=>{
      const lethal=ev.rule==='betrayal_kill'||ev.rule==='battle_justice';
      for(const c of Object.values(ev.binding)){
        const t=$('tile_'+panelIdx+'_'+c);
        if(t&&lethal){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}}
      const f=document.createElement('div');
      f.className='float-label';
      f.textContent=RULE_LABEL[ev.rule]||ev.rule;
      panelEl.appendChild(f);
      setTimeout(()=>f.remove(),950)},180+k*320)})}

function winSequence(events){
  $('goalBox').src=artUri('icon_box_done')||'';
  const n=panels.length;
  for(let i=0;i<n;i++)
    setTimeout(()=>{const el=$('panel'+i);if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}},350+i*320);
  setTimeout(()=>{
    const fc=level().factCard;
    $('accBadge').textContent=ACC_LABEL[fc.accuracy]||fc.accuracy;
    $('accBadge').className='acc '+fc.accuracy;
    $('factText').textContent=fc.text;
    $('factSource').textContent='— '+fc.source;
    $('nextLevelBtn').style.display=levelIdx<LEVELS.length-1?'':'none';
    $('overlay').classList.add('show')},350+n*320+250)}

let hintTimer=null;
function flashHint(t){
  $('hintText').textContent=t;
  clearTimeout(hintTimer);hintTimer=setTimeout(()=>{$('hintText').textContent=''},2600)}

$('hintBtn').addEventListener('click',()=>{
  const lv=level();
  let sceneIds;
  if(lv.solution)sceneIds=lv.solution.map(p=>p.scene);
  else{const sols=solve(lv,CONTENT,1);
    if(!sols.length){flashHint('Решений нет — это баг контента!');return}
    sceneIds=sols[0].map(p=>p.sceneId)}
  flashHint('Порядок сцен: '+sceneIds.map(s=>CONTENT.scenes[s].name).join(' → '))});
$('resetBtn').addEventListener('click',resetLevel);
$('againBtn').addEventListener('click',resetLevel);
$('nextLevelBtn').addEventListener('click',()=>{if(levelIdx<LEVELS.length-1){levelIdx++;resetLevel()}});
$('prevBtn').addEventListener('click',()=>{levelIdx=(levelIdx+1)%LEVELS.length;resetLevel()});
$('overlay').addEventListener('click',ev=>{if(ev.target===$('overlay'))$('overlay').classList.remove('show')});

resetLevel();
</script>
