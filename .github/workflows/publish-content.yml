name: Публикация контента

# Запускается кнопкой «Опубликовать» в редакторе (через workflow_dispatch) и автоматически,
# когда контент меняется в main. Ключи R2 живут в секретах репозитория: репозиторий публичный,
# и попасть в код они не должны.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Content/**'
      - 'tools/publish_content.py'
      - 'tools/upload_r2.py'

# Публикация меняет общее состояние — параллельные прогоны затёрли бы друг друга.
concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Валидатор
        # Гоняет солвер по всем уровням. Ненулевой код — нерешаемый уровень или неверный
        # эталон; тогда шаг падает и до заливки дело не доходит.
        working-directory: android
        run: ./gradlew -q :engine:run

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet boto3

      - name: Номер версии
        # Берём то, что сейчас в облаке, и добавляем единицу: так номер не откатывается
        # назад от перезапусков CI, в отличие от номера прогона.
        id: ver
        run: |
          CURRENT=$(curl -fsS "$BASE/manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || echo 0)
          echo "next=$((CURRENT + 1))" >> "$GITHUB_OUTPUT"
          echo "в облаке сейчас v$CURRENT, публикуем v$((CURRENT + 1))"
        env:
          BASE: https://pub-6903ffa4531e43d19ab534800387df28.r2.dev

      - name: Сборка манифеста
        run: python3 tools/publish_content.py --version ${{ steps.ver.outputs.next }}

      - name: Заливка в R2
        run: python3 tools/upload_r2.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
