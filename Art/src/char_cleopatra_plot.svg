<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Клеопатра: чёрное каре, золотая диадема с коброй, бирюзовый воротник -->
  <!-- платье/плечи -->
  <path d="M 44 256 Q 46 200 84 182 L 172 182 Q 210 200 212 256 Z" fill="#2e7d80" stroke="#2b2419" stroke-width="6"/>
  <!-- золотой воротник -->
  <path d="M 84 182 Q 128 218 172 182 L 164 198 Q 128 230 92 198 Z" fill="#c8a356" stroke="#2b2419" stroke-width="5"/>
  <rect x="114" y="152" width="28" height="34" fill="#e3b68c" stroke="#2b2419" stroke-width="5"/>
  <ellipse cx="128" cy="106" rx="48" ry="56" fill="#eac298" stroke="#2b2419" stroke-width="6"/>
  <!-- каре: боковые пряди -->
  <path d="M 80 84 Q 76 50 128 46 Q 180 50 176 84 L 176 140 Q 176 152 164 152 L 164 96 Q 150 64 106 64 Q 92 64 92 96 L 92 152 Q 80 152 80 140 Z" fill="#1d1813" stroke="#2b2419" stroke-width="5"/>
  <!-- чёлка -->
  <path d="M 88 78 Q 128 60 168 78 Q 150 70 128 70 Q 106 70 88 78 Z" fill="#1d1813" stroke="#2b2419" stroke-width="4"/>
  <!-- диадема -->
  <path d="M 84 72 L 172 72 L 172 82 L 84 82 Z" fill="#c8a356" stroke="#2b2419" stroke-width="4"/>
  <!-- кобра на диадеме -->
  <path d="M 124 72 Q 120 56 128 50 Q 138 54 132 64 Q 130 68 132 72 Z" fill="#7c9437" stroke="#2b2419" stroke-width="4"/>
  <!-- подводка глаз (кошачьи стрелки) -->
  <path d="M 96 102 L 118 102 L 124 106 M 160 102 L 138 102 L 132 106" fill="none" stroke="#1d1813" stroke-width="6" stroke-linecap="round"/>
  <path d="M 100 108 L 116 108 M 140 108 L 156 108" fill="none" stroke="#2b2419" stroke-width="6" stroke-linecap="round"/>
  
  <!-- брови -->
  <path d="M 96 92 Q 108 88 120 92 M 136 92 Q 148 88 160 92" fill="none" stroke="#1d1813" stroke-width="5" stroke-linecap="round"/>
  <path d="M 128 106 L 126 124 L 132 124" fill="none" stroke="#c69468" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- губы -->
  <path d="M 114 144 Q 134 148 144 138 Q 128 142 114 144 Z" fill="#a8443e" stroke="#2b2419" stroke-width="4"/>
  <!-- серьги -->
  <circle cx="82" cy="128" r="6" fill="#c8a356" stroke="#2b2419" stroke-width="3"/>
  <circle cx="174" cy="128" r="6" fill="#c8a356" stroke="#2b2419" stroke-width="3"/>
</svg>
