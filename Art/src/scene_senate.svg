<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640">
  <!-- Сенат: мрамор, ярусы скамей -->
  <rect width="512" height="640" fill="#eee5d2"/>
  <!-- стена с пилястрами -->
  <rect x="0" y="0" width="512" height="150" fill="#e3d9c2"/>
  <g fill="#d8ccb0" stroke="#2b2419" stroke-width="5">
    <rect x="40" y="0" width="30" height="150"/>
    <rect x="241" y="0" width="30" height="150"/>
    <rect x="442" y="0" width="30" height="150"/>
  </g>
  <path d="M 0 150 L 512 150" stroke="#2b2419" stroke-width="6"/>
  <!-- ярусы скамей (дуги) -->
  <g fill="#e0d4b6" stroke="#2b2419" stroke-width="5">
    <path d="M 0 220 Q 256 170 512 220 L 512 252 Q 256 204 0 252 Z"/>
    <path d="M 0 282 Q 256 232 512 282 L 512 314 Q 256 266 0 314 Z"/>
    <path d="M 0 344 Q 256 294 512 344 L 512 376 Q 256 328 0 376 Z"/>
  </g>
  <!-- кресло (курульное) по центру -->
  <path d="M 222 130 L 290 130 L 282 96 L 230 96 Z" fill="#8a3b4a" stroke="#2b2419" stroke-width="5"/>
  <path d="M 226 130 L 234 150 M 286 130 L 278 150" stroke="#2b2419" stroke-width="5"/>
  <!-- пол -->
  <rect x="0" y="376" width="512" height="264" fill="#eee5d2"/>
</svg>
