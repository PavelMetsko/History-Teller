<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960">
  <!-- Сенат: интерьер, колонны, ступени-скамьи, центральный пол, торжественно-тревожно -->
  <rect width="1280" height="960" fill="#b89c6a"/>
  <rect width="1280" height="620" fill="#c2a875"/>
  <g fill="#e9d6a6" opacity="0.35">
    <polygon points="520,0 600,0 560,620 480,620"/>
    <polygon points="720,0 800,0 840,620 760,620"/>
  </g>
  <!-- колонны -->
  <g fill="#d8c79f" stroke="#2b2419" stroke-width="6">
    <rect x="120" y="120" width="70" height="500"/>
    <rect x="300" y="120" width="70" height="500"/>
    <rect x="910" y="120" width="70" height="500"/>
    <rect x="1090" y="120" width="70" height="500"/>
  </g>
  <!-- капители -->
  <g fill="#c9b487" stroke="#2b2419" stroke-width="5">
    <rect x="110" y="104" width="90" height="22"/>
    <rect x="290" y="104" width="90" height="22"/>
    <rect x="900" y="104" width="90" height="22"/>
    <rect x="1080" y="104" width="90" height="22"/>
  </g>
  <!-- ярусные скамьи по бокам -->
  <g fill="#b39862" stroke="#2b2419" stroke-width="5">
    <path d="M 0 470 L 250 470 L 200 520 L 0 520 Z"/>
    <path d="M 0 540 L 210 540 L 150 600 L 0 600 Z"/>
    <path d="M 1280 470 L 1030 470 L 1080 520 L 1280 520 Z"/>
    <path d="M 1280 540 L 1070 540 L 1130 600 L 1280 600 Z"/>
  </g>
  <!-- центральный пол с мозаикой -->
  <rect x="0" y="620" width="1280" height="340" fill="#a98a5f"/>
  <g stroke="#8f714a" stroke-width="5" fill="none">
    <path d="M 0 720 L 1280 720"/>
    <ellipse cx="640" cy="800" rx="240" ry="90"/>
    <ellipse cx="640" cy="800" rx="150" ry="56"/>
  </g>
</svg>
