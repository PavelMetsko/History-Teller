<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640">
  <!-- Тайный ход: задние ворота дворца ночью, факелы, тёмная арка -->
  <rect width="512" height="640" fill="#23304a"/>
  <!-- луна за стеной -->
  <circle cx="430" cy="86" r="36" fill="#efe6c8" stroke="#2b2419" stroke-width="5"/>
  <circle cx="418" cy="78" r="7" fill="#ddd2ac"/>
  <!-- звёзды -->
  <g fill="#e9dfc0">
    <circle cx="70" cy="60" r="3"/><circle cx="150" cy="36" r="3"/><circle cx="250" cy="70" r="3"/>
    <circle cx="330" cy="44" r="3"/><circle cx="110" cy="120" r="2"/>
  </g>
  <!-- каменная стена -->
  <rect x="0" y="150" width="512" height="490" fill="#4a4030"/>
  <g stroke="#372f22" stroke-width="5" fill="none">
    <path d="M 0 230 L 512 230 M 0 310 L 512 310 M 0 390 L 512 390"/>
    <path d="M 96 150 L 96 230 M 288 150 L 288 230 M 416 150 L 416 230
             M 48 230 L 48 310 M 224 230 L 224 310 M 360 230 L 360 310
             M 140 310 L 140 390 M 340 310 L 340 390"/>
  </g>
  <!-- тёмный арочный проём -->
  <path d="M 184 640 L 184 360 Q 184 286 256 286 Q 328 286 328 360 L 328 640 Z"
        fill="#161d2c" stroke="#2b2419" stroke-width="7"/>
  <!-- приоткрытая створка двери -->
  <path d="M 256 300 L 200 318 L 200 624 L 256 612 Z" fill="#3a2c1c" stroke="#2b2419" stroke-width="5"/>
  <path d="M 214 360 L 244 352 M 214 430 L 244 422 M 214 500 L 244 492" stroke="#2b2419" stroke-width="4"/>
  <!-- факелы по бокам -->
  <g stroke="#2b2419" stroke-width="5">
    <rect x="120" y="330" width="12" height="70" fill="#3a2c1c"/>
    <rect x="380" y="330" width="12" height="70" fill="#3a2c1c"/>
  </g>
  <path d="M 126 332 Q 112 306 126 286 Q 140 306 126 332 Z" fill="#e0a33c" stroke="#2b2419" stroke-width="4"/>
  <path d="M 126 322 Q 119 308 126 296 Q 133 308 126 322 Z" fill="#f4d27a"/>
  <path d="M 386 332 Q 372 306 386 286 Q 400 306 386 332 Z" fill="#e0a33c" stroke="#2b2419" stroke-width="4"/>
  <path d="M 386 322 Q 379 308 386 296 Q 393 308 386 322 Z" fill="#f4d27a"/>
  <!-- тёплый ореол факелов -->
  <circle cx="126" cy="312" r="60" fill="#caa050" opacity="0.18"/>
  <circle cx="386" cy="312" r="60" fill="#caa050" opacity="0.18"/>
</svg>
