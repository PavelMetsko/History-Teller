  <g fill="#bfae8c" stroke="#2b2419" stroke-width="4">
    <rect x="40" y="352" width="26" height="48"/><rect x="140" y="352" width="26" height="48"/>
    <rect x="240" y="352" width="26" height="48"/><rect x="340" y="352" width="26" height="48"/>
    <rect x="440" y="352" width="26" height="48"/>
  </g>
  <rect x="0" y="400" width="512" height="20" fill="#bfae8c" stroke="#2b2419" stroke-width="5"/>
