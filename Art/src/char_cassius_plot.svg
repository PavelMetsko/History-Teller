<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Гай Кассий: худое лицо, чёрные гладкие волосы, оливковый плащ -->
  <path d="M 42 256 Q 44 198 82 180 L 174 180 Q 212 198 214 256 Z" fill="#6e6f4a" stroke="#2b2419" stroke-width="6"/>
  <path d="M 82 180 L 100 256 L 56 256 Q 54 210 82 180 Z" fill="#585a3a" stroke="#2b2419" stroke-width="5"/>
  <rect x="114" y="150" width="28" height="38" fill="#d8a87e" stroke="#2b2419" stroke-width="5"/>
  <!-- узкое лицо -->
  <ellipse cx="128" cy="106" rx="44" ry="60" fill="#dfb287" stroke="#2b2419" stroke-width="6"/>
  <!-- впалые щёки -->
  <path d="M 96 118 Q 102 128 100 138 M 160 118 Q 154 128 156 138" fill="none" stroke="#b98c62" stroke-width="4" stroke-linecap="round"/>
  <!-- гладкие чёрные волосы -->
  <path d="M 84 100 Q 78 44 128 42 Q 178 44 172 100 Q 166 62 128 60 Q 90 62 84 100 Z" fill="#241d16" stroke="#2b2419" stroke-width="5"/>
  <!-- косой пробор -->
  <path d="M 110 58 Q 134 52 158 62" fill="none" stroke="#3c3228" stroke-width="4" stroke-linecap="round"/>
  <!-- брови, прищур -->
  <path d="M 100 94 Q 110 92 118 96" fill="none" stroke="#241d16" stroke-width="6" stroke-linecap="round"/>
  <path d="M 138 96 Q 146 92 156 94" fill="none" stroke="#241d16" stroke-width="6" stroke-linecap="round"/>
  <!-- прищуренные глаза -->
  <path d="M 100 106 L 116 106 M 140 106 L 156 106" fill="none" stroke="#2b2419" stroke-width="6" stroke-linecap="round"/>
  <path d="M 128 104 L 125 128 L 133 128" fill="none" stroke="#b98c62" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- тонкий недовольный рот -->
  <path d="M 112 146 Q 134 148 146 138" fill="none" stroke="#2b2419" stroke-width="5" stroke-linecap="round"/>
  <circle cx="92" cy="198" r="8" fill="#a8a06a" stroke="#2b2419" stroke-width="4"/>
</svg>
