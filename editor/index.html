<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Teller — редактор</title>
<style>
  :root {
    --paper:#F1E4C7; --panel:#F7EFDC; --ink:#2B2419; --ink-soft:rgba(43,36,25,.55);
    --gold:#C9A24B; --maroon:#8A3B4A; --backdrop:#34222E; --ok:#4C8B51; --bad:#B03030;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--backdrop); color:var(--ink);
    font:14px/1.45 ui-rounded,-apple-system,system-ui,sans-serif;
  }
  header {
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--ink); color:var(--paper);
  }
  header h1 { font:600 15px/1 ui-serif,Georgia,serif; margin:0; letter-spacing:.3px; }
  header .status { margin-left:auto; font-size:12px; color:rgba(241,228,199,.65); }

  main { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 41px); }
  @media (max-width:860px) { main { grid-template-columns:1fr; } #detail:not(.open) { display:none; }
                             main.detail-open #sidebar { display:none; } }

  #sidebar { overflow-y:auto; background:var(--paper); border-right:2px solid var(--ink); }
  .chapter { padding:9px 14px; background:var(--ink); color:var(--gold);
             font:600 11px/1 ui-rounded,sans-serif; letter-spacing:1.4px; text-transform:uppercase; }
  .lvl { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer;
         border-bottom:1px solid rgba(43,36,25,.09); }
  .lvl:hover { background:var(--panel); }
  .lvl.sel { background:var(--gold); }
  .lvl .ord { color:var(--ink-soft); font-size:11px; min-width:26px; }
  .lvl .nm { flex:1; }
  .lvl .off { color:var(--bad); font-size:10px; font-weight:700; }
  .badge { font-size:10px; font-weight:700; padding:1px 5px; border-radius:7px;
           background:rgba(43,36,25,.12); }
  .badge.tight { background:rgba(76,139,81,.25); }
  .badge.loose { background:rgba(176,48,48,.2); }

  #detail { overflow-y:auto; padding:18px 22px; background:var(--panel); }
  #detail h2 { font:700 21px/1.2 ui-serif,Georgia,serif; margin:0 0 2px; }
  #detail .sub { color:var(--ink-soft); font-size:12px; margin-bottom:16px; }
  section { margin-bottom:18px; }
  section > h3 { font:700 10px/1 ui-rounded,sans-serif; letter-spacing:1.4px;
                 text-transform:uppercase; color:var(--maroon); margin:0 0 8px; }

  .cast { display:flex; flex-wrap:wrap; gap:10px; }
  .cast figure { margin:0; width:62px; text-align:center; }
  .cast img { width:52px; height:62px; object-fit:contain; display:block; margin:0 auto; }
  .cast .miss { width:52px; height:62px; margin:0 auto; border:2px dashed var(--bad);
                border-radius:6px; color:var(--bad); font-size:9px; display:flex;
                align-items:center; justify-content:center; }
  .cast figcaption { font-size:10px; color:var(--ink-soft); margin-top:2px; word-break:break-word; }
  .scenes { display:flex; flex-wrap:wrap; gap:10px; }
  .scenes figure { margin:0; width:96px; }
  .scenes img { width:96px; height:66px; object-fit:cover; border:2px solid var(--ink);
                border-radius:7px; display:block; }

  .panels { display:flex; gap:10px; flex-wrap:wrap; }
  .panel { width:150px; border:2px solid var(--ink); border-radius:9px; overflow:hidden;
           background:var(--paper); }
  .panel .ph { height:78px; background-size:cover; background-position:center;
               display:flex; align-items:flex-end; justify-content:center; gap:1px; }
  .panel .ph img { height:56px; }
  .panel .cap { padding:4px 6px; font-size:10px; color:var(--ink-soft); }

  pre { background:var(--paper); border:1px solid rgba(43,36,25,.2); border-radius:7px;
        padding:9px 11px; font:11px/1.4 ui-monospace,Menlo,monospace; overflow-x:auto; margin:0; }

  button { font:600 13px/1 ui-rounded,sans-serif; padding:9px 18px; border-radius:20px;
           border:2px solid var(--ink); background:var(--maroon); color:var(--paper);
           cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--ink); }

  #verdict { margin-top:10px; display:none; }
  #verdict.show { display:block; }
  .metrics { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .metric { text-align:center; }
  .metric b { display:block; font:700 20px/1.1 ui-serif,Georgia,serif; }
  .metric span { font-size:10px; color:var(--ink-soft); text-transform:uppercase;
                 letter-spacing:.8px; }
  .note { font-size:12px; padding:7px 10px; border-radius:7px; }
  .note.ok { background:rgba(76,139,81,.18); }
  .note.bad { background:rgba(176,48,48,.15); color:var(--bad); font-weight:600; }
  .empty { color:var(--ink-soft); padding:40px 0; text-align:center; }

  .langs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
  button.lang { padding:4px 9px; font-size:11px; border-radius:12px; border:1.5px solid var(--ink);
                background:transparent; color:var(--ink); text-transform:uppercase; }
  button.lang.on { background:var(--ink); color:var(--paper); }
  .field { display:block; margin-bottom:10px; }
  .field > span { display:block; font-size:10px; letter-spacing:.8px; text-transform:uppercase;
                  color:var(--ink-soft); margin-bottom:3px; }
  .field input, .field textarea {
    width:100%; padding:7px 9px; border:1.5px solid rgba(43,36,25,.3); border-radius:6px;
    background:var(--paper); color:var(--ink); font:13px/1.4 inherit; resize:vertical;
  }
  .field input:focus, .field textarea:focus { outline:none; border-color:var(--gold); }
  .field .ru { display:block; font-size:11px; color:var(--ink-soft); margin-top:3px;
               padding-left:9px; border-left:2px solid var(--gold); }
  .savebar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;
             padding-top:12px; border-top:1px solid rgba(43,36,25,.15); }
  #saveinfo { font-size:11px; color:var(--ink-soft); }
  .dim { font-size:11px; color:var(--ink-soft); margin-top:6px; }

  figure { position:relative; }
  button.x { position:absolute; top:-5px; right:-5px; width:19px; height:19px; padding:0;
             border-radius:50%; border:1.5px solid var(--ink); background:var(--bad);
             color:#fff; font:700 12px/1 sans-serif; }
  button.add { width:52px; height:62px; padding:0; border-radius:8px; border:2px dashed var(--ink);
               background:transparent; color:var(--ink); font:300 26px/1 sans-serif; }
  .scenes button.add { width:96px; height:66px; }

  .panel.edit { width:172px; }
  .panel select { width:100%; border:0; border-top:2px solid var(--ink); border-radius:0;
                  padding:5px 6px; font:11px inherit; background:var(--panel); color:var(--ink); }
  .slots { display:flex; flex-wrap:wrap; gap:3px; padding:5px 6px; }
  button.slot { padding:3px 7px; font-size:10px; border-radius:10px; border:1.5px solid var(--ink);
                background:transparent; color:var(--ink); }
  button.slot.on { background:var(--gold); }
  button.slot:disabled { opacity:.3; }

  .fields { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .field.small { width:120px; margin-bottom:0; }
  .field.small select { width:100%; padding:7px 9px; border:1.5px solid rgba(43,36,25,.3);
                        border-radius:6px; background:var(--paper); color:var(--ink); font:13px inherit; }
  .toggle { display:flex; align-items:center; gap:7px; font-size:12px; width:100%; }
  .miss.wide { width:96px; height:66px; }

  .overlay { position:fixed; inset:0; background:rgba(20,12,18,.7); display:flex;
             align-items:center; justify-content:center; padding:20px; z-index:50; }
  .sheet { background:var(--panel); border:3px solid var(--ink); border-radius:14px;
           width:min(720px,100%); max-height:80vh; display:flex; flex-direction:column; padding:14px; }
  .sheethead { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .sheethead button { padding:5px 12px; font-size:12px; }
  .search { width:100%; padding:8px 10px; margin-bottom:10px; border-radius:7px;
            border:1.5px solid rgba(43,36,25,.3); background:var(--paper); font:13px inherit; }
  .pickgrid { overflow-y:auto; display:grid; gap:8px;
              grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); }
  button.pick { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px;
                background:var(--paper); border:1.5px solid rgba(43,36,25,.25); border-radius:8px;
                color:var(--ink); font:10px inherit; }
  button.pick:hover { border-color:var(--gold); }
  button.pick img { height:56px; object-fit:contain; }
  button.pick img.wide { width:80px; height:52px; object-fit:cover; border-radius:4px; }

  button.mini { padding:5px 11px; font-size:12px; border-width:1.5px; border-color:var(--gold);
                background:transparent; color:var(--gold); }
  textarea.code { width:100%; padding:9px 11px; border:1.5px solid rgba(43,36,25,.3);
                  border-radius:7px; background:var(--paper); color:var(--ink);
                  font:11px/1.4 ui-monospace,Menlo,monospace; resize:vertical; }
  textarea.code:focus { outline:none; border-color:var(--gold); }
  textarea.code.broken { border-color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>History Teller · редактор</h1>
  <button id="newlevel" class="mini">+ уровень</button>
  <div class="status" id="status">загрузка контента…</div>
</header>
<main id="main">
  <div id="sidebar"></div>
  <div id="detail"><div class="empty">Выбери уровень слева</div></div>
</main>
<script src="app.js"></script>
</body>
</html>
