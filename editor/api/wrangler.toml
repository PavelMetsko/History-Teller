name = "history-teller-editor-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# Свой домен вместо *.workers.dev: адрес Worker'а лежит в коде редактора, то есть
# общеизвестен, а внутри у него токен с правом записи в репозиторий. Открывать его можно
# только за Cloudflare Access, а тот работает лишь на собственной зоне.
workers_dev = false
routes = [
  { pattern = "api.historyteller.app", custom_domain = true },
]

[vars]
REPO = "PavelMetsko/History-Teller"
BRANCH = "main"
CDN_BASE = "https://cdn.historyteller.app"
# Только редактор — чтобы чужая страница не дёргала API из браузера пользователя.
ALLOW_ORIGIN = "https://editor.historyteller.app"

# Токен задаётся отдельно и в файл не пишется:
#   npx wrangler secret put GITHUB_TOKEN
# Нужен fine-grained PAT на этот репозиторий: contents=write, actions=write.
